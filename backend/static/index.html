<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQ - MoE Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">EduQ</h1>
            <p class="text-xs text-emerald-200">MoE Bangladesh AI Assistant</p>
        </div>
        <div class="text-xs bg-emerald-800 px-3 py-1 rounded-full border border-emerald-600">
            Beta Pilot
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start gap-3">
            <div class="bg-emerald-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">EQ</div>
            <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[80%]">
                <p class="text-gray-800">হ্যালো! আমি <strong>EduQ</strong>। শিক্ষা মন্ত্রণালয়, বোর্ড বা এনসিটিবি (NCTB) সংক্রান্ত কোনো প্রশ্ন থাকলে আমাকে জিজ্ঞাসা করতে পারেন। How can I help you today?</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t border-gray-200 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Ask EduQ in English or Bangla..." 
                class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-shadow text-gray-700" required>
            <button type="submit" 
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-medium transition-colors shadow-sm">
                Send
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        
        // Generate a random session ID for this browser tab
        const sessionId = "session_" + Math.random().toString(36).substring(2, 9);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            // Append User Message
            container.innerHTML += `
                <div class="flex items-start gap-3 justify-end">
                    <div class="bg-emerald-50 p-4 rounded-2xl rounded-tr-none shadow-sm border border-emerald-100 max-w-[80%]">
                        <p class="text-gray-800">${text}</p>
                    </div>
                    <div class="bg-gray-300 text-gray-700 rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">U</div>
                </div>`;
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, session_id: sessionId })
                });
                
                const data = await response.json();
                
                // Append EduQ Message
                container.innerHTML += `
                    <div class="flex items-start gap-3">
                        <div class="bg-emerald-700 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">EQ</div>
                        <div class="bg-white p-4 rounded-2xl rounded-tl-none shadow-sm border border-gray-100 max-w-[80%]">
                            <p class="text-gray-800 whitespace-pre-wrap">${data.response}</p>
                            <div class="mt-2 pt-2 border-t border-gray-100 flex justify-between items-center text-[10px] text-gray-400">
                                <span>Source: ${data.source}</span>
                                <span>Tier: ${data.tier}</span>
                            </div>
                        </div>
                    </div>`;
            } catch (error) {
                container.innerHTML += `<div class="text-center text-red-500 text-sm">Error connecting to EduQ backend.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
